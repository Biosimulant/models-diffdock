name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (OSS CLI)
        run: |
          GITLEAKS_VERSION="8.30.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks git --redact --verbose --exit-code 1 .

  validate-manifests:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check public/internal boundary
        run: bash scripts/check_public_boundary.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          pip install pyyaml
          pip install "biosim @ git+https://github.com/BioSimulant/biosim.git@main"
      - name: Validate manifest schema
        run: python scripts/validate_manifests.py
      - name: Check entrypoints
        run: python scripts/check_entrypoints.py
      - name: Build packages
        run: python scripts/validate_packages.py

  smoke-sandbox:
    runs-on: ubuntu-latest
    needs: [validate-manifests]
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          pip install pyyaml
          pip install "biosim @ git+https://github.com/BioSimulant/biosim.git@main"
      - name: Smoke run checks (sandbox-compatible image)
        run: |
          python scripts/validate_manifests.py
          python scripts/check_entrypoints.py
          python scripts/validate_packages.py
