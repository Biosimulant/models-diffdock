name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (OSS CLI)
        run: |
          GITLEAKS_VERSION="8.30.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks git --redact --verbose --exit-code 1 .

  validate-manifests:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check public/internal boundary
        run: |
          if rg -n --hidden --glob '!.git/**' --glob '!internal/**' '(^|/)internal/' .; then
            echo "Public content must not reference internal repository paths." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          pip install pyyaml
          pip install "biosimulant==0.0.26"
      - name: Validate manifest schema
        run: |
          for lab in labs/*; do
            [ -d "$lab" ] || continue
            biosimulant labs validate "$lab"
          done
      - name: Build packages
        run: |
          output_dir="$(mktemp -d)"
          for lab in labs/*; do
            [ -d "$lab" ] || continue
            biosimulant labs package "$lab" --out "$output_dir"
          done

  smoke-sandbox:
    runs-on: ubuntu-latest
    needs: [validate-manifests]
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          pip install pyyaml
          pip install "biosimulant==0.0.26"
      - name: Smoke run checks (sandbox-compatible image)
        run: |
          output_dir="$(mktemp -d)"
          for lab in labs/*; do
            [ -d "$lab" ] || continue
            biosimulant labs validate "$lab"
            biosimulant labs package "$lab" --out "$output_dir"
          done
